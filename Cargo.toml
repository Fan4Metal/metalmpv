[package]
# The identifier: the exe, the Cargo package, the GitHub repository, the
# single-instance names. The display name ("MetalMPV") lives in main.rs,
# setup.iss, build.rs and the READMEs.
name = "metalmpv"
# Between releases: the next version with "-dev"; a release drops it.
version = "0.1.0-dev"
authors = ["Fan4_Metal"]
edition = "2024"
rust-version = "1.95"
description = "A fast video player for Windows built on libmpv"
license = "MIT"
repository = "https://github.com/Fan4Metal/metalmpv"

[dependencies]
# glow, not the default wgpu: a smaller binary and a faster start (an OpenGL
# context is created in ~130 ms against ~240 ms for wgpu on DX12). eframe's
# default features are off: no accesskit, no wgpu and no `links` (URLs are
# opened through win::shell_open instead of ui.hyperlink_to).
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence"] }
egui = "0.36"
# File and folder dialogs without default features: only windows-sys,
# raw-window-handle and log are pulled in.
rfd = { version = "0.17.2", default-features = false }
raw-window-handle = "0.6"
log = "0.4"
env_logger = "0.11"
# The same winit as eframe's, for `WindowExtWindows::set_undecorated_shadow`
# (the frameless window in fullscreen, see frameless.rs).
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }
# The system's font families, for the subtitle and OSD fonts (fonts.rs).
fontdb = { version = "0.23.0", default-features = false, features = ["fs", "memmap"] }
# Already used by egui, which reads fonts with it: a chosen font is checked with it first.
skrifa = { version = "0.44.0", default-features = false, features = ["std"] }
# Cover art: the pictures of audio tags and of MP4 (cover.rs; MKV is read by hand).
lofty = "0.25.4"
# Decoding a cover (already used by eframe's clipboard): JPEG and PNG only.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies]
# Keep the feature list minimal; add a feature only for an API that is used.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",            # GetUserDefaultUILanguage (i18n)
    "Win32_Graphics_Gdi",             # WNDCLASSW (instance.rs)
    "Win32_Networking_WinHttp",       # the update check
    "Win32_System_Console",           # AttachConsole for the command line modes
    "Win32_System_DataExchange",      # COPYDATASTRUCT (instance.rs)
    "Win32_System_LibraryLoader",     # LoadLibraryW for libmpv, GetModuleHandleW
    "Win32_System_Power",             # SetThreadExecutionState while playing
    "Win32_Security",                 # CreateMutexW's attributes (instance.rs)
    "Win32_System_Registry",          # the file types (assoc.rs)
    "Win32_System_Threading",         # CreateMutexW (instance.rs)
    "Win32_UI_Shell",                 # ShellExecuteW, SHChangeNotify (assoc.rs)
    "Win32_UI_WindowsAndMessaging",   # SW_SHOWNORMAL, the message-only window
] }

[target.'cfg(windows)'.build-dependencies]
# Embeds the icon and the version information into the exe.
winresource = "0.1"
# The 256 px layers of the file type icons, stored as PNG.
png = "0.18"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# A panic ends the process; main::install_panic_hook shows it first.
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

# Dependencies optimised in debug builds too, so that a debug build is usable.
[profile.dev.package."*"]
opt-level = 3
